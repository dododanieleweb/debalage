[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# All routes: never cache (the redirect always serves index.html)
# Browsers and Netlify CDN will always fetch fresh content
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control                     = "no-store, no-cache, must-revalidate"
    Pragma                            = "no-cache"
    X-Frame-Options                   = "DENY"
    X-Content-Type-Options            = "nosniff"
    X-XSS-Protection                  = "1; mode=block"
    Referrer-Policy                   = "strict-origin-when-cross-origin"
    Permissions-Policy                = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security         = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy           = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ui-avatars.com https://jrsbefallmiakxkdqxwe.supabase.co https://images.unsplash.com; connect-src 'self' https://jrsbefallmiakxkdqxwe.supabase.co wss://jrsbefallmiakxkdqxwe.supabase.co; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"

# JS/CSS chunks have content-hash filenames — safe to cache for 1 year
# This rule is more specific and overrides the /* rule above for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Same-origin proxy for Supabase Auth. Some browser/network configurations
# block the cross-origin auth request even when CORS is valid.
[[redirects]]
  from   = "/api/supabase/*"
  to     = "https://jrsbefallmiakxkdqxwe.supabase.co/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
